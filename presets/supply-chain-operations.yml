# Supply chain and operations employers; weekly vendor lists feed postings, the seed list carries the rest.
id: supply-chain-operations
name: "Supply chain, operations, industrial engineering"
coverage:
  level: semi-automated
  note: "Semi-automated: one vendor's weekly supply chain and industrial engineering lists are the only postings feeds, so the employer list carries the rest. Rotational programs at large manufacturers and retailers are the main route in."
title_rules:
  include:
    - "supply chain"
    - "logistics"
    - "procurement"
    - "sourcing"
    - "planning"
    - "operations"
    - "industrial"
    - "manufacturing"
    - "quality"
    - "process"
    - "inventory"
    - "distribution"
    - "co-?op"
  exclude:
    - "inside sales|sales (rep|representative|associate)"
    - "recruit"
    - "driver"
    - "warehouse associate"
early_career: "\\b(intern(ship)?|co-?op|new ?grad(uate)?|early[- ]career|entry[- ]level|analyst i|associate|junior|university|campus|rotational)\\b"
recruiting_calendar:
  rollover_month: 8
  lead_months: 12
  terms:
    - {name: Spring, start_month: 1}
    - {name: Summer, start_month: 5}
    - {name: Fall, start_month: 8}
sources:
  github_lists:
    - name: litos-supply-chain
      repo: mehek-builds/Hiring-Now
      path: csv/supply-chain.csv
      format: csv
      kind: internship
      field_map: {company: Company, title: Role, location: Location, date: Posted, url: Link}
    - name: litos-industrial-engineering
      repo: mehek-builds/Hiring-Now
      path: csv/industrial-engineering.csv
      format: csv
      kind: internship
      field_map: {company: Company, title: Role, location: Location, date: Posted, url: Link}
  alerts:
    - name: "Handshake saved search"
      how: "Save searches for supply chain, logistics and operations intern and co-op."
    - name: "Society career centers"
      how: "CSCMP and IISE post boards for members; check them by hand."
search_terms:
    - "supply chain intern"
    - "logistics analyst intern"
    - "operations rotational program"
    - "industrial engineering intern"
    - "procurement analyst new grad"
