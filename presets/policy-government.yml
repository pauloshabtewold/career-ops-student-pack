id: policy-government
name: "Policy, political science, government"
coverage:
  level: semi-automated
  note: "Discovery by alert for federal roles: save a USAJOBS search with email alerts and the inbox step reads them; think tanks, state and local jobs, and nonprofits stay manual or alert-only. Federal agencies and the employers with no readable board stay as watch-only seeds, about 52% of the seed list. State and city boards on governmentjobs.com are not scanned, because that site disallows bots. City of New York student and entry-level postings come from NYC Open Data when the nyc-jobs feed is enabled."
title_rules:
  include:
    - "policy"
    - "analyst"
    - "program"
    - "research"
    - "legislative"
    - "intern"
    - "fellow"
    - "pathways"
    - "public"
    - "government"
    - "economist"
    - "communications"
  exclude:
    - "sales"
    - "recruit"
    - "nurse"
    - "driver"
early_career: "\\b(intern(ship)?|pathways|fellow(ship)?|new ?grad(uate)?|early[- ]career|entry[- ]level|associate|junior|university|recent graduate)\\b"
recruiting_calendar:
  rollover_month: 8
  lead_months: 10
  terms:
    - {name: Spring, start_month: 1}
    - {name: Summer, start_month: 5}
    - {name: Fall, start_month: 8}
sources:
  nyc_jobs: true
  github_lists:
    - name: litos-policy
      repo: mehek-builds/Hiring-Now
      path: csv/policy-government-affairs.csv
      format: csv
      kind: internship
      field_map: {company: Company, title: Role, location: Location, date: Posted, url: Link}
  alerts:
    - name: "USAJOBS"
      how: "Save a USAJOBS search with the Pathways and recent graduates hiring paths and turn on its email alerts; the inbox step reads those alerts."
    - name: "Think tank pages"
      how: "Check think tank internship pages by hand each term."
    - name: "Idealist"
      how: "Idealist bars scraping, so use its email alerts only."
search_terms:
  - "policy intern"
  - "pathways intern"
  - "legislative intern"
  - "research assistant policy"
  - "program analyst entry level"
