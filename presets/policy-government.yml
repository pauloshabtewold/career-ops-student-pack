id: policy-government
name: "Policy, political science, government"
coverage:
  level: semi-automated
  note: "Semi-automated for federal roles through the USAJOBS source you can enable with a free key; think tanks, state and local jobs, and nonprofits stay manual or alert-only."
title_rules:
  include:
    - "policy"
    - "analyst"
    - "program"
    - "research"
    - "legislative"
    - "intern"
    - "fellow"
    - "pathways"
    - "public"
    - "government"
    - "economist"
    - "communications"
  exclude:
    - "sales"
    - "recruit"
    - "nurse"
    - "driver"
early_career: "\\b(intern(ship)?|pathways|fellow(ship)?|new ?grad(uate)?|early[- ]career|entry[- ]level|associate|junior|university|recent graduate)\\b"
recruiting_calendar:
  rollover_month: 8
  lead_months: 10
  terms:
    - {name: Spring, start_month: 1}
    - {name: Summer, start_month: 5}
    - {name: Fall, start_month: 8}
sources:
  github_lists: []
  alerts:
    - name: "USAJOBS"
      how: "Upstream has a keyed USAJOBS source: enable it after getting a free API key; set HiringPath to student and graduates."
    - name: "Think tank pages"
      how: "Check think tank internship pages by hand each term."
    - name: "Idealist"
      how: "Idealist bars scraping, so use its email alerts only."
search_terms:
  - "policy intern"
  - "pathways intern"
  - "legislative intern"
  - "research assistant policy"
  - "program analyst entry level"
