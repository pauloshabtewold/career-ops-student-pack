# Strategy, Big Four, technology and boutique consulting firms; deadline trackers give dates only and the seed list carries the rest.
id: consulting
name: "Consulting (any major)"
coverage:
  level: semi-automated
  note: "Semi-automated for dates only: deadline trackers feed dates only and there is no postings feed for consulting, so the employer list and the alerts carry this preset. Strategy firms open applications in a narrow window."
title_rules:
  include:
    - "consult"
    - "analyst"
    - "associate"
    - "advisory"
    - "strategy"
    - "summer associate"
    - "business analyst"
    - "technology consultant"
  exclude:
    - "inside sales|sales (rep|representative|associate)"
    - "recruit"
    - "driver"
early_career: "\\b(intern(ship)?|new ?grad(uate)?|early[- ]career|entry[- ]level|analyst|associate|summer associate|junior|university|campus)\\b"
recruiting_calendar:
  rollover_month: 1
  lead_months: 15
  terms:
    - {name: Summer, start_month: 6}
    - {name: Fall, start_month: 8}
sources:
  # No postings-level list exists for consulting; deadline trackers appear under alerts and inform dates only.
  github_lists: []
  alerts:
    - name: "My Consulting Coach deadline finder"
      how: "A deadline tracker for consulting application windows; it gives dates, not postings."
    - name: "MBB Prep timeline"
      how: "A calendar of strategy firm windows; it gives dates, not postings."
    - name: "University career-office deadline posts"
      how: "Your school career office posts firm deadlines each term; check them by hand."
search_terms:
  - "consulting intern"
  - "business analyst intern"
  - "summer associate"
  - "technology consultant new grad"
  - "advisory analyst"
