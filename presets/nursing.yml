# Hospital systems and health employers whose career boards upstream career-ops reads; new-grad RN residencies and nursing externships are posted there.
id: nursing
name: "Nursing"
coverage:
  level: semi-automated
  note: "Semi-automated: the seed employer list covers about 75 US hospital systems, children's hospitals and health employers whose career boards the scan reads, so residency, graduate nurse and extern postings reach your ranking daily. No community list covers nursing, so a posting that lives only on a system's own site, a state board or a school placement office is not seen: Kaiser Permanente, Providence, Ascension, CommonSpirit and several large academic centers use boards the scan cannot read, so add those to your own employer list and keep a Handshake alert for them."
title_rules:
  include:
    - "nurse"
    - "nursing"
    - "\\brn\\b"
    - "extern"
    - "residency"
    - "graduate nurse"
    - "patient care tech"
    - "clinical nurse"
  exclude:
    - "nurse practitioner"
    - "\\bcrna\\b"
    - "\\blpn\\b"
    - "\\blvn\\b"
    - "travel"
    - "agency"
    - "recruit"
    - "sales representative"
    - "driver"
    - "pharmac"
    - "\\bpgy"
    - "(resident|attending|staff) physician"
    - "physician (assistant|associate|fellow|resident|scientist)"
    - "social work"
    - "program (specialist|coordinator|manager)"
early_career: "\\b(residency|resident|new ?grad(uate)?|graduate (registered )?nurse|graduate rn|extern(ship)?|intern(ship)?|student nurse|nurse tech(nician)?|patient care tech(nician)?|transition to practice|early[- ]career|entry[- ]level)\\b"
recruiting_calendar:
  rollover_month: 7
  lead_months: 9
  terms:
    - {name: Winter, start_month: 1}
    - {name: Summer, start_month: 6}
    - {name: Fall, start_month: 9}
sources:
  github_lists: []
  alerts:
    - name: "Handshake saved search"
      how: "Save searches for nurse residency, new grad RN and nurse extern."
    - name: "Hospital residency pages"
      how: "Most systems post summer and fall residency cohorts on their own nurse residency page 6 to 9 months ahead; bookmark the page for each system you want and apply the week it opens."
    - name: "Hospital job alerts"
      how: "Turn on email alerts for graduate nurse and nurse extern on each system's career site, including systems the employer list cannot read."
search_terms:
  - "new grad RN residency"
  - "nurse residency program"
  - "graduate nurse"
  - "nurse extern"
  - "student nurse intern"
  - "nurse technician"
assessment_domains:
  - "hirevue.com"
  - "shl.com"
  - "criteriacorp.com"
archetypes:
  - "New graduate registered nurse residency"
  - "Nurse extern or student nurse intern"
  - "Registered nurse"
  - "Nurse technician or patient care technician"
employer_policies: []
