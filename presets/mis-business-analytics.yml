id: mis-business-analytics
name: "MIS, information systems, business analytics"
coverage:
  level: semi-automated
  note: "Semi-automated: nothing is MIS-specific, so analyst lists plus title rules feed the queue, and the employer list below carries consulting and rotational programs."
title_rules:
  include:
    - "analyst"
    - "business"
    - "systems"
    - "information technology"
    - " it "
    - "data"
    - "technology consult"
    - "erp"
    - "sap"
    - "salesforce"
    - "technology risk"
    - "it audit"
    - "cybersecurity"
    - "solutions"
    - "technical program"
    - "rotational"
  exclude:
    - "sales representative"
    - "nurse"
    - "recruit"
    - "driver"
early_career: "\\b(intern(ship)?|co-?op|new ?grad(uate)?|early[- ]career|entry[- ]level|analyst i|associate|rotational|leadership program|university|campus)\\b"
recruiting_calendar:
  rollover_month: 6
  lead_months: 13
  terms:
    - {name: Winter, start_month: 1}
    - {name: Spring, start_month: 2}
    - {name: Summer, start_month: 5}
    - {name: Fall, start_month: 8}
sources:
  github_lists:
    - name: jobright-ba-intern
      repo: jobright-ai/2026-Business-Analyst-Internship
      path: README.md
      format: markdown-table
      kind: internship
    - name: jobright-ba-newgrad
      repo: jobright-ai/2026-Business-Analyst-New-Grad
      path: README.md
      format: markdown-table
      kind: newgrad
    - name: jobright-da-intern
      repo: jobright-ai/2026-Data-Analysis-Internship
      path: README.md
      format: markdown-table
      kind: internship
    - name: jobright-da-newgrad
      repo: jobright-ai/2026-Data-Analysis-New-Grad
      path: README.md
      format: markdown-table
      kind: newgrad
    - name: simplify-intern
      repo: SimplifyJobs/Summer2027-Internships
      path: .github/scripts/listings.json
      format: simplify-json
      kind: internship
    - name: simplify-newgrad
      repo: SimplifyJobs/New-Grad-Positions
      path: .github/scripts/listings.json
      format: simplify-json
      kind: newgrad
  alerts:
    - name: "Handshake saved search"
      how: "Save searches for business analyst, systems analyst and technology consultant."
    - name: "LinkedIn job alerts"
      how: "Alerts for technology consulting and IT rotational programs."
search_terms:
  - "business analyst intern"
  - "systems analyst intern"
  - "technology consultant analyst"
  - "data analyst intern"
  - "IT rotational program"
