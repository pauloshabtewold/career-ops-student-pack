id: software-cs
name: "Software engineering, computer science"
coverage:
  level: automated
  note: "Automated: the community internship and new-grad lists for software, data, ML and product roles are read daily, plus the company boards below."
title_rules:
  include:
    - "software"
    - "engineer"
    - "developer"
    - "swe"
    - "sde"
    - "data"
    - "machine learning"
    - "ml "
    - "ai "
    - "product manag"
    - "backend"
    - "frontend"
    - "full.?stack"
    - "platform"
    - "infrastructure"
    - "security"
  exclude:
    - "sales"
    - "recruit"
    - "account executive"
    - "marketing"
    - "nurse"
    - "clinical"
early_career: "\\b(intern(ship)?|co-?op|new ?grad(uate)?|early[- ]career|entry[- ]level|university|campus|junior|associate|engineer i|software engineer i)\\b"
recruiting_calendar:
  rollover_month: 7
  lead_months: 12
  terms:
    - {name: Winter, start_month: 1}
    - {name: Spring, start_month: 2}
    - {name: Summer, start_month: 5}
    - {name: Fall, start_month: 8}
sources:
  github_lists:
    - name: simplify-intern
      repo: SimplifyJobs/Summer2027-Internships
      path: .github/scripts/listings.json
      format: simplify-json
      kind: internship
    - name: simplify-newgrad
      repo: SimplifyJobs/New-Grad-Positions
      path: .github/scripts/listings.json
      format: simplify-json
      kind: newgrad
    - name: vansh-intern
      repo: vanshb03/Summer2027-Internships
      path: README.md
      format: markdown-table
      kind: internship
    - name: vansh-newgrad
      repo: vanshb03/New-Grad-2027
      path: README.md
      format: markdown-table
      kind: newgrad
    - name: speedy-intern
      repo: speedyapply/2027-SWE-College-Jobs
      path: README.md
      format: markdown-table
      kind: internship
    - name: speedy-newgrad
      repo: speedyapply/2027-SWE-College-Jobs
      path: NEW_GRAD_USA.md
      format: markdown-table
      kind: newgrad
  alerts:
    - name: "Handshake saved search"
      how: "Save a software search on Handshake and turn on email alerts."
    - name: "LinkedIn job alerts"
      how: "Create alerts for software engineer intern and new grad."
search_terms:
  - "software engineer intern"
  - "new grad software engineer"
  - "data engineer intern"
  - "machine learning intern"
  - "product manager intern"
