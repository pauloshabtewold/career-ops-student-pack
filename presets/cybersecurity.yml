# Security vendors, tech, consulting, defense and bank security teams; federal agencies are not seeds because USAJOBS covers them.
id: cybersecurity
name: "Cybersecurity"
coverage:
  level: semi-automated
  note: "Semi-automated: one maintained list feeds postings and it marks clearance-required roles, which carry '(clearance required)' in the title; a student who cannot hold a clearance adds the dealbreaker 'clearance' in the interview. Federal and intelligence roles are not on that list, so use the USAJOBS alert for them."
title_rules:
  include:
    - "security"
    - "cyber"
    - "\\bsoc\\b"
    - "threat"
    - "incident"
    - "forensic"
    - "grc"
    - "risk"
    - "compliance"
    - "penetration"
    - "offensive"
    - "appsec"
    - "cloud security"
    - "\\biam\\b"
    - "vulnerability"
  exclude:
    - "inside sales|sales (rep|representative|associate)"
    - "recruit"
early_career: "\\b(intern(ship)?|co-?op|new ?grad(uate)?|early[- ]career|entry[- ]level|analyst i|engineer i|associate|apprentice|junior|university|campus)\\b"
recruiting_calendar:
  rollover_month: 7
  lead_months: 12
  terms:
    - {name: Winter, start_month: 1}
    - {name: Spring, start_month: 2}
    - {name: Summer, start_month: 5}
    - {name: Fall, start_month: 8}
sources:
  github_lists:
    # clearance and closed name the listings.json keys the parser reads: clearance-required rows keep a title suffix, closed rows are skipped.
    - name: hackedrico-cyber
      repo: HackedRico/2027-cyber-jobs
      path: listings.json
      format: json-array
      kind: internship
      field_map: {company: company, title: role, location: location, date: date_added, url: url, clearance: clearance, closed: closed}
  alerts:
    - name: "USAJOBS"
      how: "The HackedRico list excludes federal and intelligence roles. Upstream has a keyed USAJOBS source: enable it after getting a free API key; set HiringPath to student and graduates."
    - name: "Handshake saved search"
      how: "Save searches for security, SOC and cyber intern."
search_terms:
    - "security intern"
    - "SOC analyst intern"
    - "cybersecurity analyst new grad"
    - "penetration testing intern"
    - "GRC analyst intern"
