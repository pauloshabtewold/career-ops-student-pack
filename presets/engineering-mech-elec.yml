id: engineering-mech-elec
name: "Mechanical, aerospace, electrical and chemical engineering"
coverage:
  level: semi-automated
  note: "Semi-automated: community lists exist for mechanical, electrical and aerospace; chemical is thin. Defense and aerospace roles often need citizenship, so the filters exclude clearance-only postings."
title_rules:
  include:
    - "engineer"
    - "mechanical"
    - "electrical"
    - "aerospace"
    - "chemical"
    - "hardware"
    - "manufacturing"
    - "process"
    - "design"
    - "test"
    - "systems"
    - "controls"
    - "power"
    - "embedded"
    - "co-?op"
  exclude:
    - "security clearance required"
    - "ts/sci"
    - "u\\.s\\. citizen(ship)? only"
    - "citizenship required"
    - "sales"
    - "recruit"
early_career: "\\b(intern(ship)?|co-?op|new ?grad(uate)?|early[- ]career|entry[- ]level|engineer i|associate engineer|junior|university|campus|rotational)\\b"
recruiting_calendar:
  rollover_month: 8
  lead_months: 12
  terms:
    - {name: Spring, start_month: 1}
    - {name: Summer, start_month: 5}
    - {name: Fall, start_month: 8}
sources:
  github_lists:
    - name: tracker05-me
      repo: Tracker05/mechanical-engineering-internships
      path: jobs.json
      format: json-array
      kind: internship
    - name: wonofakind-2027
      repo: WonOfAKind/New-Grad-And-Internships-2027
      path: jobs.json
      format: json-array
      kind: internship
    - name: hiderrick-eng
      repo: hiderrick/Engineering-Internships-Summer-2027
      path: jobs.json
      format: json-array
      kind: internship
    - name: meche-tracker
      repo: MechEJobTracker/MechEJobTracker
      path: README.md
      format: markdown-table
      kind: internship
    - name: litos-me
      repo: mehek-builds/Hiring-Now
      path: mechanical-engineering.csv
      format: csv
      kind: internship
    - name: litos-ee
      repo: mehek-builds/Hiring-Now
      path: electrical-engineering.csv
      format: csv
      kind: internship
    - name: litos-aero
      repo: mehek-builds/Hiring-Now
      path: aerospace-engineering.csv
      format: csv
      kind: internship
    - name: litos-che
      repo: mehek-builds/Hiring-Now
      path: chemical-engineering.csv
      format: csv
      kind: internship
  alerts:
    - name: "Handshake saved search"
      how: "Save searches for mechanical, electrical or aerospace engineering intern and co-op."
    - name: "Society career centers"
      how: "ASME, AIChE, AIAA and IEEE post boards for members; check them by hand."
search_terms:
  - "mechanical engineering intern"
  - "electrical engineering intern"
  - "aerospace engineering co-op"
  - "chemical engineering intern"
  - "manufacturing engineer new grad"
