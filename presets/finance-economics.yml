id: finance-economics
name: "Finance, economics"
coverage:
  level: semi-automated
  note: "Semi-automated: only corporate finance has a community list; banks, asset managers and rotational programs come from the employer list below, and investment banking windows open far ahead."
title_rules:
  include:
    - "analyst"
    - "finance"
    - "financial"
    - "investment"
    - "banking"
    - "markets"
    - "trading"
    - "treasury"
    - "fp&a"
    - "risk"
    - "research"
    - "economist"
    - "rotational"
    - "quantitative"
  exclude:
    - "sales representative"
    - "teller"
    - "recruit"
    - "nurse"
early_career: "\\b(intern(ship)?|summer analyst|new ?grad(uate)?|early[- ]career|entry[- ]level|analyst program|rotational|leadership program|campus|university|associate)\\b"
recruiting_calendar:
  rollover_month: 4
  lead_months: 15
  terms:
    - {name: Winter, start_month: 1}
    - {name: Spring, start_month: 3}
    - {name: Summer, start_month: 6}
    - {name: Fall, start_month: 9}
sources:
  github_lists:
    - name: jobright-account-intern
      repo: jobright-ai/2026-Account-Internship
      path: README.md
      format: markdown-table
      kind: internship
    - name: jobright-account-newgrad
      repo: jobright-ai/2026-Account-New-Grad
      path: README.md
      format: markdown-table
      kind: newgrad
  alerts:
    - name: "Handshake saved search"
      how: "Save searches for summer analyst, finance intern and rotational program."
    - name: "LinkedIn job alerts"
      how: "Alerts for investment banking analyst and corporate finance."
    - name: "Bank career sites"
      how: "Banks post analyst programs on their own sites; check them in the fall."
search_terms:
  - "summer analyst"
  - "finance intern"
  - "corporate finance rotational program"
  - "investment banking analyst"
