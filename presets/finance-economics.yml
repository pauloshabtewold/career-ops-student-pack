id: finance-economics
name: "Finance, economics"
coverage:
  level: semi-automated
  note: "Semi-automated: community internship, new-grad and quant lists feed the queue; banks, asset managers and rotational programs come from the employer list below, and investment banking windows open far ahead."
title_rules:
  include:
    - "analyst"
    - "finance"
    - "financial"
    - "investment"
    - "banking"
    - "markets"
    - "trading"
    - "treasury"
    - "fp&a"
    - "risk"
    - "research"
    - "economist"
    - "rotational"
    - "quantitative"
  exclude:
    - "sales representative"
    - "teller"
    - "recruit"
    - "nurse"
early_career: "\\b(intern(ship)?|summer analyst|new ?grad(uate)?|early[- ]career|entry[- ]level|analyst program|rotational|leadership program|campus|university|summer associate|associate (program|intern(ship)?))\\b"
recruiting_calendar:
  rollover_month: 4
  lead_months: 15
  terms:
    - {name: Winter, start_month: 1}
    - {name: Spring, start_month: 3}
    - {name: Summer, start_month: 6}
    - {name: Fall, start_month: 9}
sources:
  github_lists:
    - name: simplify-intern
      repo: SimplifyJobs/Summer2027-Internships
      path: .github/scripts/listings.json
      format: simplify-json
      kind: internship
    - name: simplify-newgrad
      repo: SimplifyJobs/New-Grad-Positions
      path: .github/scripts/listings.json
      format: simplify-json
      kind: newgrad
    - name: quant-intern
      repo: quant-scraper/Quant-Internships-New-Grad-2027
      path: README.md
      format: markdown-table
      kind: internship
    - name: litos-finance-intern
      repo: mehek-builds/Hiring-Now
      path: csv/finance-internships.csv
      format: csv
      kind: internship
      field_map: {company: Company, title: Role, location: Location, date: Posted, url: Link}
    - name: litos-visa-finance
      repo: mehek-builds/Finance-Accounting-Visa-Internships
      path: csv/finance.csv
      format: csv
      kind: internship
      field_map: {company: Company, title: Role, location: Location, date: Posted, url: Link}
    - name: litos-visa-quant
      repo: mehek-builds/Finance-Accounting-Visa-Internships
      path: csv/quant-risk.csv
      format: csv
      kind: internship
      field_map: {company: Company, title: Role, location: Location, date: Posted, url: Link}
  alerts:
    - name: "Handshake saved search"
      how: "Save searches for summer analyst, finance intern and rotational program."
    - name: "LinkedIn job alerts"
      how: "Alerts for investment banking analyst and corporate finance."
    - name: "Bank career sites"
      how: "Banks post analyst programs on their own sites; check them in the fall."
search_terms:
  - "summer analyst"
  - "finance intern"
  - "corporate finance rotational program"
  - "investment banking analyst"
