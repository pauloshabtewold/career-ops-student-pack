id: accounting
name: "Accounting"
coverage:
  level: semi-automated
  note: "Semi-automated: one community list covers audit and tax on a 7-day rolling window and is polled daily; the Big Four and mid-tier firms come from the employer list below."
title_rules:
  include:
    - "audit"
    - "tax"
    - "accounting"
    - "assurance"
    - "advisory"
    - "financial reporting"
    - "forensic"
    - "risk"
    - "internal audit"
    - "staff"
    - "associate"
  exclude:
    - "sales representative"
    - "recruit"
    - "nurse"
    - "driver"
early_career: "\\b(intern(ship)?|busy[- ]season|new ?grad(uate)?|early[- ]career|entry[- ]level|staff|associate|campus|university|rotational)\\b"
recruiting_calendar:
  rollover_month: 7
  lead_months: 12
  terms:
    - {name: Winter, start_month: 1}
    - {name: Spring, start_month: 2}
    - {name: Summer, start_month: 6}
    - {name: Fall, start_month: 9}
sources:
  github_lists:
    - name: jobright-account-intern
      repo: jobright-ai/2026-Account-Internship
      path: README.md
      format: markdown-table
      kind: internship
    - name: jobright-account-newgrad
      repo: jobright-ai/2026-Account-New-Grad
      path: README.md
      format: markdown-table
      kind: newgrad
  alerts:
    - name: "Handshake saved search"
      how: "Save searches for audit intern, tax intern and assurance associate."
    - name: "Firm career sites"
      how: "Winter busy-season internships are posted on each firm site in the spring and summer."
search_terms:
  - "audit intern"
  - "tax intern"
  - "assurance associate"
  - "accounting intern"
  - "advisory intern"
