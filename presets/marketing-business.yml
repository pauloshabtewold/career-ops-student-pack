# Consumer brands, tech marketing, media and retail; one vendor list feeds postings, the seed list carries the rest.
id: marketing-business
name: "Marketing, general business"
coverage:
  level: semi-automated
  note: "Semi-automated: no marketing-specific list is maintained anywhere, so the employer list carries this preset; one vendor's weekly marketing list adds postings. Brand and rotational programs hire mostly through company sites."
title_rules:
  include:
    - "marketing"
    - "brand"
    - "communications"
    - "social media"
    - "content"
    - "digital"
    - "growth"
    - "sales"
    - "business"
    - "rotational"
    - "leadership development"
    - "merchandising"
    - "market research"
  exclude:
    - "recruit"
    - "driver"
    - "cashier"
    - "sales engineer"
early_career: "\\b(intern(ship)?|co-?op|new ?grad(uate)?|early[- ]career|entry[- ]level|associate|assistant|junior|university|campus|rotational|leadership development)\\b"
recruiting_calendar:
  rollover_month: 6
  lead_months: 13
  terms:
    - {name: Winter, start_month: 1}
    - {name: Spring, start_month: 2}
    - {name: Summer, start_month: 5}
    - {name: Fall, start_month: 8}
sources:
  github_lists:
    - name: litos-marketing
      repo: mehek-builds/Hiring-Now
      path: csv/marketing.csv
      format: csv
      kind: internship
      field_map: {company: Company, title: Role, location: Location, date: Posted, url: Link}
  alerts:
    - name: "Handshake saved search"
      how: "Save searches for marketing, brand and business development intern."
    - name: "HeadcountLabs"
      how: "Its list was header-only when last checked; look again each term."
    - name: "intern-list.com"
      how: "Email alerts only."
search_terms:
    - "marketing intern"
    - "brand management intern"
    - "associate marketing manager"
    - "business development associate"
    - "marketing analyst"
