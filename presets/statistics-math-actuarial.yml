# Insurers, actuarial consultancies, analytics and quant employers; vendor lists feed postings, the seed list carries the rest.
id: statistics-math-actuarial
name: "Statistics, math, actuarial"
coverage:
  level: semi-automated
  note: "Semi-automated: data analyst roles are well covered, while actuarial and statistics lists are thin, so insurers' own boards carry the actuarial roles. Exam progress matters more than the major for actuarial hiring."
title_rules:
  include:
    - "actuar"
    - "statistic"
    - "data analyst"
    - "analytics"
    - "quantitative"
    - "math"
    - "biostat"
    - "risk"
    - "model"
    - "research"
  exclude:
    - "inside sales|sales (rep|representative|associate)"
    - "recruit"
    - "\\b(insurance|sales|field) agent\\b"
early_career: "\\b(intern(ship)?|co-?op|new ?grad(uate)?|early[- ]career|entry[- ]level|actuarial assistant|analyst i|associate|junior|university|campus|rotational)\\b"
recruiting_calendar:
  rollover_month: 4
  lead_months: 15
  terms:
    - {name: Winter, start_month: 1}
    - {name: Spring, start_month: 3}
    - {name: Summer, start_month: 6}
    - {name: Fall, start_month: 9}
sources:
  github_lists:
    - name: litos-math
      repo: mehek-builds/Hiring-Now
      path: csv/math-internships.csv
      format: csv
      kind: internship
      field_map: {company: Company, title: Role, location: Location, date: Posted, url: Link}
    - name: litos-actuarial
      repo: mehek-builds/Hiring-Now
      path: csv/actuarial-internships.csv
      format: csv
      kind: internship
      field_map: {company: Company, title: Role, location: Location, date: Posted, url: Link}
    - name: litos-pc-actuarial
      repo: mehek-builds/Hiring-Now
      path: csv/pc-actuarial.csv
      format: csv
      kind: internship
      field_map: {company: Company, title: Role, location: Location, date: Posted, url: Link}
  alerts:
    - name: "ASA STATtr@k internship list"
      how: "The American Statistical Association posts a statistics internship list each December; check it by hand."
    - name: "CAS career center"
      how: "The Casualty Actuarial Society career center lists actuarial roles for members."
    - name: "acturhire.com"
      how: "Partly paywalled; check by hand."
    - name: "Handshake saved search"
      how: "Save searches for actuarial, statistics and data analyst intern."
search_terms:
    - "actuarial analyst intern"
    - "data analyst intern"
    - "statistics intern"
    - "quantitative analyst intern"
    - "actuarial assistant"
