# Suggested Codex settings for the career-ops folder. This file is optional.
#
# To use it, copy it to .codex/config.toml inside your career-ops folder yourself. The pack never writes that file.
# Codex reads a project config only for a folder you have trusted: accept its trust prompt for this folder when it asks.

# Reads the whole AGENTS.override.md (upstream's rules alone are larger than the 32768 byte default).
project_doc_max_bytes = 131072

sandbox_mode = "workspace-write"
approval_policy = "on-request"

[sandbox_workspace_write]
network_access = true

# Gmail tools that change mail, switched off. The pack only searches and reads mail. Codex keys app settings by the
# connector id, not by the name "gmail"; this id is the Gmail connector's own and is the same for every account. A live
# listing run (codex-cli 0.166, trusted folder) showed none of the tools below once this file was in place, and the ten
# read tools stayed. The rule in AGENTS.student.md, which says never to call a Gmail write tool, stays the main guard.
[apps.connector_2128aebfecb84f64a069897515042a44.tools.send_email]
enabled = false

[apps.connector_2128aebfecb84f64a069897515042a44.tools.send_draft]
enabled = false

[apps.connector_2128aebfecb84f64a069897515042a44.tools.forward_emails]
enabled = false

[apps.connector_2128aebfecb84f64a069897515042a44.tools.delete_emails]
enabled = false

[apps.connector_2128aebfecb84f64a069897515042a44.tools.archive_emails]
enabled = false

[apps.connector_2128aebfecb84f64a069897515042a44.tools.create_draft]
enabled = false

[apps.connector_2128aebfecb84f64a069897515042a44.tools.update_draft]
enabled = false

[apps.connector_2128aebfecb84f64a069897515042a44.tools.batch_modify_email]
enabled = false

[apps.connector_2128aebfecb84f64a069897515042a44.tools.apply_labels_to_emails]
enabled = false

[apps.connector_2128aebfecb84f64a069897515042a44.tools.bulk_label_matching_emails]
enabled = false

[apps.connector_2128aebfecb84f64a069897515042a44.tools.create_label]
enabled = false
