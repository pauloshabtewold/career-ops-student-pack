# Defaults for every config/student.yml key. A safety release may change this file.
onboarding:
  complete: false
presets: []
tracks: []
experience_years: 0
# true keeps clearance and citizenship-only postings in the lists; the interview asks.
us_citizen: false
timezone: ""
locations: []
switches:
  outreach: "on"
  handshake: "on"
  submission: agent
# Becomes scheduled-discovery after the first successful run (set by the interview).
automation: manual
# The agent that runs the daily triage (claude or codex); the interview records the one it runs in.
agent: claude
spend_tier: standard
daily_target: 10
score_floor: 3.5
linkedin_tier: free
limits: {}
# Model-usage triage budget, owned by the student: daily rows (default 20) and first-run rows (default 60), each a whole
# number or "all". Change it with node student/scripts/triage-budget.mjs set, which shows the cost first.
triage_budget: {}
# One of claude-pro, claude-max, claude-ultra, chatgpt-plus, chatgpt-pro, api, unknown. It only picks the estimate line shown.
plan: unknown
resume_variants: []
mailbox:
  backend: connector
schedule:
  time: "06:00"
rank:
  weights: {}
  metros: []
  marquee: []
  parent_companies: {}
  # Ranking knobs; see docs/usage.md (Tuning the apply list and the weekly audit).
  company_caps: {}
  intern_only: []
  one_track_per_company: false
  ignore_words: []
  easy_apply_hosts: [greenhouse, ashby, lever]
  contacts_format: stage
  metro_match: word
  hold_on_pending_connect: true
dealbreakers: []
judgment_keywords: []
# Keys for the weekly second look at judgment FAIL rows.
audit:
  exclude_reasons: []
  require_triage: false
  keyword_match: word
  duplicate_reason: first
