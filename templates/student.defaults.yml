# Defaults for every config/student.yml key. A safety release may change this file.
onboarding:
  complete: false
presets: []
tracks: []
experience_years: 0
# bachelor, master or doctorate; the free degree rule in the daily triage stays off while this is unset.
degree: unset
# true keeps clearance and citizenship-only postings in the lists; the interview asks.
us_citizen: false
timezone: ""
locations: []
switches:
  outreach: "on"
  handshake: "on"
  submission: user
# Set by the interview's Phase 5 answer; manual unless the student chose a schedule.
automation: manual
# The agent that runs the daily triage (claude or codex); the interview records the one it runs in.
agent: claude
spend_tier: standard
daily_target: 10
score_floor: 3.5
linkedin_tier: free
# "on" has a fresh-context reviewer check each 4.0+ application's drafts before the batch is shown (modes/review.md). Off by default; it spends model usage.
reviewer: "off"
# Days a company research note in data/research/ counts as fresh (scripts/research-cache.mjs).
research_cache_days: 30
# Starting LinkedIn connect pace, below the hard ceilings of 20 a day and 100 a rolling week in scripts/budget.mjs. A
# student may raise either up to its ceiling; anything above is clamped and the clamp is logged.
limits:
  connect_per_day: 15
  connect_per_rolling_7d: 80
# Model-usage triage budget, owned by the student: daily rows (default 20) and first-run rows (default 60), each a whole
# number or "all". Change it with node student/scripts/triage-budget.mjs set, which shows the cost first.
triage_budget: {}
# One of claude-pro, claude-max, claude-ultra, chatgpt-plus, chatgpt-pro, api, unknown. It only picks the estimate line shown.
plan: unknown
resume_variants: []
mailbox:
  backend: connector
  # The interview's Part D turns this on after the Gmail check; on runs the inbox pass after the daily run.
  schedule: "off"
schedule:
  time: "06:00"
rank:
  weights: {}
  metros: []
  marquee: []
  parent_companies: {}
  # Ranking knobs; see docs/usage.md (Tuning the apply list and the weekly audit).
  company_caps: {}
  intern_only: []
  one_track_per_company: false
  ignore_words: []
  easy_apply_hosts: [greenhouse, ashby, lever]
  contacts_format: stage
  metro_match: word
  hold_on_pending_connect: true
dealbreakers: []
judgment_keywords: []
# Keys for the weekly second look at judgment FAIL rows.
audit:
  exclude_reasons: []
  require_triage: false
  keyword_match: word
  duplicate_reason: first
# yes when a scheduled run reaches the automation Chrome (tools/schedule-probe.mjs decides); no keeps Chrome steps for
# when Chrome is open. unset until the probe or setup runs.
chrome_in_schedule: unset
# Open postings the first hourly fresh scan of a board adds to Pending, newest first; the rest are only marked seen.
fresh_first_scan: 25
browser:
  # Empty means <data>/chrome-automation.
  automation_profile: ""
  # Command run before every automation Chrome launch; any non-zero exit means wait. BROWSER_SLOT_CMD overrides it.
  slot_cmd: ""
