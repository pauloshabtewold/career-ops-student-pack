<!DOCTYPE html>
<!-- ATS-safe resume template: one column, standard font, no letter-spacing or justify, plain bullets and headings, so the
     PDF text layer reads in order with real spaces. scripts/build-resume.mjs fills the {{...}} slots from cv.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{name}}</title>
<style>
  @page { size: letter; margin: 0.5in 0.6in; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 10.5pt; line-height: 1.3; color: #000; margin: 0; }
  h1 { font-size: 16pt; margin: 0 0 2pt 0; font-weight: bold; }
  .contact { margin: 0 0 8pt 0; }
  h2 { font-size: 11pt; font-weight: bold; text-transform: none; border-bottom: 1px solid #000; margin: 8pt 0 3pt 0; padding: 0; }
  h3 { font-size: 10.5pt; font-weight: bold; margin: 4pt 0 1pt 0; }
  p { margin: 0 0 2pt 0; text-align: left; }
  ul { margin: 0 0 2pt 0; padding: 0; list-style: none; }
  li { margin: 0 0 1pt 0; padding-left: 10pt; text-indent: -10pt; text-align: left; }
  .nowrap { white-space: nowrap; }
</style>
</head>
<body>
<h1>{{name}}</h1>
<p class="contact">{{contact}}</p>
{{sections}}
</body>
</html>
