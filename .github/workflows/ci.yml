name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
      - run: npm ci
      - run: npm run lint
      - run: node --test --test-concurrency=1
      - run: node scripts/compat-hash.mjs --check
      - name: Plugin versions
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-plugin-versions.mjs "origin/$BASE_REF"

  upstream-install:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
      - run: npm ci
      - name: Install into upstream at the newest supported version
        run: node scripts/ci/upstream-setup.mjs --out ${{ runner.temp }}/upstream
      - name: Doctor
        run: node scripts/ci/assert-doctor.mjs ${{ runner.temp }}/upstream/doctor.json

  chrome-e2e:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
      - run: npm ci
      - run: node --test --test-concurrency=1 tests/e2e/chrome-spike.test.mjs tests/e2e/chrome-fill.test.mjs tests/e2e/live-mock.test.mjs
