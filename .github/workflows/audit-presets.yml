name: audit-presets

on:
  schedule:
    - cron: "43 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci
      - name: Install into upstream at the newest supported version
        run: node scripts/ci/upstream-setup.mjs --out ${{ runner.temp }}/upstream
      - name: Restore last month's output
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/audit-prev
          key: preset-audit-${{ github.run_id }}
          restore-keys: preset-audit-
      # audit-portals exits non-zero only on a real failure here (no --strict), as does preset-portals. A failed preset is recorded and its
      # partial output dropped so the other presets still get their issues; the last step then fails the job.
      - name: Audit each preset
        id: audit
        run: |
          mkdir -p "${{ runner.temp }}/audit-now" "${{ runner.temp }}/audit-prev"
          cd "${{ runner.temp }}/upstream"
          failed=()
          for file in student/presets/*.yml; do
            id=$(basename "$file" .yml)
            [ "$id" = "OWNERS" ] && continue
            if ! node student/scripts/preset-portals.mjs "$id" > "${{ runner.temp }}/portals-$id.yml"; then
              echo "::error::preset-portals failed for preset $id"
              failed+=("$id")
              continue
            fi
            args=(--json --file "${{ runner.temp }}/portals-$id.yml")
            [ -f "${{ runner.temp }}/audit-prev/$id.json" ] && args+=(--baseline "${{ runner.temp }}/audit-prev/$id.json")
            if ! node audit-portals.mjs "${args[@]}" > "${{ runner.temp }}/audit-now/$id.json"; then
              echo "::error::audit-portals failed for preset $id"
              rm -f "${{ runner.temp }}/audit-now/$id.json"
              failed+=("$id")
            fi
          done
          echo "failed=${failed[*]}" >> "$GITHUB_OUTPUT"
      # One open issue per preset: a flagged preset with an open audit issue gets a comment, otherwise a new issue.
      - name: File or update one issue per flagged preset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo ${{github.repository}} --state open --limit 500 --json number,title > "${{ runner.temp }}/open-issues.json"
          node scripts/ci/audit-issues.mjs --current "${{ runner.temp }}/audit-now" --previous "${{ runner.temp }}/audit-prev" --open "${{ runner.temp }}/open-issues.json" --repo ${{github.repository}}
      # Overlay, so a preset whose audit failed keeps last month's output as its baseline.
      - name: Keep this month's output for next time
        run: cp -R "${{ runner.temp }}/audit-now/." "${{ runner.temp }}/audit-prev/"
      - uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/audit-prev
          key: preset-audit-${{ github.run_id }}
      - name: Fail when an audit run failed
        if: steps.audit.outputs.failed != ''
        env:
          FAILED: ${{ steps.audit.outputs.failed }}
        run: |
          echo "::error::audit-portals failed for: $FAILED"
          exit 1
