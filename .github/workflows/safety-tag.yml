name: safety-tag

on:
  push:
    tags: ["safety-*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci
      # The base is chosen in Node (pickBase): nearest earlier release or safety tag, else the first v tag.
      - name: Compare with the nearest earlier release or safety tag
        env:
          THIS_TAG: ${{ github.ref_name }}
        run: node scripts/check-safety-tag.mjs "$THIS_TAG"
